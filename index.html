<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Portfolio · ポートフォリオ</title>
    <link href="./src/data/images/favicon.png" rel="icon" type="image/x-icon" />
    <script>
      (function () {
        var dark = matchMedia("(prefers-color-scheme: dark)").matches;
        try { var s = localStorage.getItem("theme"); if (s) dark = s === "dark"; } catch (e) {}
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
